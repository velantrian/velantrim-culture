<svg xmlns="http://www.w3.org/2000/svg" width="280" height="76" viewBox="0 0 280 76" role="img" aria-labelledby="title desc">
  <title id="title">Русский</title>
  <desc id="desc">The Russian tricolour beside the word Русский in raised, dark metallic blue lettering on a deep blue plaque.</desc>
  <defs>
    <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263f55"/>
      <stop offset="0.48" stop-color="#152c40"/>
      <stop offset="1" stop-color="#0c1b2b"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd6e6"/>
      <stop offset="0.45" stop-color="#557b97"/>
      <stop offset="0.72" stop-color="#a9c9dc"/>
      <stop offset="1" stop-color="#385a75"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9effb"/>
      <stop offset="0.22" stop-color="#789db7"/>
      <stop offset="0.44" stop-color="#c7dfed"/>
      <stop offset="0.68" stop-color="#6589a4"/>
      <stop offset="1" stop-color="#aac8da"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offsetBlur"/>
      <feFlood flood-color="#020914" flood-opacity="0.9" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="flag-clip"><rect x="20" y="23" width="48" height="30" rx="3"/></clipPath>
  </defs>
  <rect x="3" y="3" width="274" height="70" rx="15" fill="url(#plaque)" stroke="url(#frame)" stroke-width="2"/>
  <rect x="8" y="8" width="264" height="60" rx="11" fill="none" stroke="#a9c6d9" stroke-opacity="0.22"/>
  <g clip-path="url(#flag-clip)">
    <rect x="20" y="23" width="48" height="10" fill="#ffffff"/>
    <rect x="20" y="33" width="48" height="10" fill="#2451a4"/>
    <rect x="20" y="43" width="48" height="10" fill="#d52b1e"/>
  </g>
  <rect x="20" y="23" width="48" height="30" rx="3" fill="none" stroke="#d6e5ee" stroke-width="1"/>
  <text x="87" y="50" fill="#030c16" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="0.2">Русский</text>
  <text x="87" y="45" fill="#d5eaf8" fill-opacity="0.42" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="0.2">Русский</text>
  <text x="87" y="48" fill="url(#steel)" stroke="#29465e" stroke-width="0.65" paint-order="stroke" filter="url(#soft-shadow)" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="0.2">Русский</text>
</svg>
